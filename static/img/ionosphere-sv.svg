<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="title desc">
  <title id="title">D-skiktet–F2-skiktet</title>
  <desc id="desc">Schematisk bild av jonosfärens skikt och ett HF-hopp. Höjderna är inte skalenliga.</desc>
  <defs>
    <clipPath id="frame"><rect width="900" height="560" rx="16" ry="16"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071018"/>
      <stop offset="60%" stop-color="#102033"/>
      <stop offset="100%" stop-color="#1a3344"/>
    </linearGradient>
    <radialGradient id="earth" cx="50%" cy="38%" r="70%">
      <stop offset="0%" stop-color="#3d6a4e"/>
      <stop offset="60%" stop-color="#2a4c3a"/>
      <stop offset="100%" stop-color="#163024"/>
    </radialGradient>
    <linearGradient id="ray" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff4b8"/>
      <stop offset="50%" stop-color="#ffe27a"/>
      <stop offset="100%" stop-color="#fff4b8"/>
    </linearGradient>
    <linearGradient id="gwfade" gradientUnits="userSpaceOnUse"
      x1="87.4" y1="469.0" x2="206.3" y2="457.4">
      <stop offset="0%" stop-color="#f3e6a8" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#f3e6a8" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="900" height="560" fill="url(#bg)"/>
    <circle cx="70" cy="36" r="1.2" fill="#dce7f5" opacity="0.7"/>
    <circle cx="130" cy="64" r="0.8" fill="#dce7f5" opacity="0.7"/>
    <circle cx="200" cy="28" r="1.0" fill="#dce7f5" opacity="0.7"/>
    <circle cx="280" cy="50" r="0.7" fill="#dce7f5" opacity="0.7"/>
    <circle cx="360" cy="22" r="1.1" fill="#dce7f5" opacity="0.7"/>
    <circle cx="500" cy="38" r="0.8" fill="#dce7f5" opacity="0.7"/>
    <circle cx="620" cy="20" r="1.0" fill="#dce7f5" opacity="0.7"/>
    <circle cx="740" cy="48" r="0.7" fill="#dce7f5" opacity="0.7"/>
    <circle cx="830" cy="30" r="1.2" fill="#dce7f5" opacity="0.7"/>
    <circle cx="860" cy="90" r="0.8" fill="#dce7f5" opacity="0.7"/>
    <circle cx="48" cy="100" r="0.6" fill="#dce7f5" opacity="0.7"/>
    <circle cx="800" cy="120" r="0.7" fill="#dce7f5" opacity="0.7"/>
    <circle cx="240" cy="80" r="0.5" fill="#dce7f5" opacity="0.7"/>
    <circle cx="430" cy="16" r="0.6" fill="#dce7f5" opacity="0.7"/>
    <circle cx="680" cy="86" r="0.5" fill="#dce7f5" opacity="0.7"/>
    <circle cx="560" cy="70" r="0.5" fill="#dce7f5" opacity="0.7"/>
    <circle cx="150" cy="120" r="0.5" fill="#dce7f5" opacity="0.7"/>

    <circle cx="395" cy="2348" r="1900" fill="url(#earth)"/>
    <path d="M -207.26,537.54 A 1908,1908 0 0 1 719.76,467.84 L 718.40,475.72 A 1900,1900 0 0 0 -204.73,545.14 Z" fill="#9ec9c0" fill-opacity="0.18"/>

    <path d="M -201.40,512.46 A 1930,1930 0 0 1 710.22,443.92 L 706.63,465.62 A 1908,1908 0 0 0 -194.60,533.38 Z" fill="#e39a3a" fill-opacity="0.40" stroke="#ffd08a" stroke-width="1.15" stroke-opacity="0.9"/>
    <path d="M -212.84,477.27 A 1967,1967 0 0 1 716.26,407.41 L 711.04,438.98 A 1935,1935 0 0 0 -202.95,507.71 Z" fill="#d1b63a" fill-opacity="0.40" stroke="#f5e48a" stroke-width="1.15" stroke-opacity="0.9"/>
    <path d="M -228.60,428.77 A 2018,2018 0 0 1 724.59,357.10 L 717.08,402.48 A 1972,1972 0 0 0 -214.38,472.52 Z" fill="#2f9d6e" fill-opacity="0.40" stroke="#8ee0b4" stroke-width="1.15" stroke-opacity="0.9"/>
    <path d="M -249.30,365.05 A 2085,2085 0 0 1 735.53,291.00 L 725.41,352.16 A 2023,2023 0 0 0 -230.14,424.01 Z" fill="#1f8ea3" fill-opacity="0.40" stroke="#7ee3ef" stroke-width="1.15" stroke-opacity="0.9"/>

    <!-- Ground wave -->
    <path d="M 87.03,467.05 A 1906,1906 0 0 1 205.74,451.42" fill="none" stroke="url(#gwfade)" stroke-width="3.6" stroke-linecap="round"/>
    <text x="140.1" y="436.9" fill="#f3e6a8" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" text-anchor="middle">Markvåg</text>

    <!-- Dead zone -->
    <line x1="222.3" y1="449.8" x2="220.5" y2="429.9" stroke="#c9d4e0" stroke-width="1.4" opacity="0.9"/>
    <line x1="552.4" y1="448.5" x2="554.0" y2="428.6" stroke="#c9d4e0" stroke-width="1.4" opacity="0.9"/>
    <path d="M 221.40,439.88 A 1916,1916 0 0 1 553.20,438.54" fill="none" stroke="#c9d4e0" stroke-width="1.4" stroke-dasharray="5 4" opacity="0.9"/>
    <text x="387.2" y="408.0" fill="#dce5ee" font-size="13" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" text-anchor="middle">Död zon</text>

    <!-- Skywave -->
    <path d="M 87.35,469.02 C 194.65,305.17 218.64,295.17 325.78,295.17 C 432.92,295.17 463.06,305.17 575.38,452.56" fill="none" stroke="#ffef9a" stroke-width="6" opacity="0.20" stroke-linecap="round"/>
    <path d="M 87.35,469.02 C 194.65,305.17 218.64,295.17 325.78,295.17 C 432.92,295.17 463.06,305.17 575.38,452.56" fill="none" stroke="url(#ray)" stroke-width="2.5" stroke-linecap="round"/>
    <text x="133.9" y="251.2" fill="#ffef9a" font-size="13.5" font-weight="600" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif" text-anchor="middle">Rymdvåg (skip)</text>

    <g>
      <polygon points="79.9,473.3 95.7,470.7 85.9,460.1" fill="#c8d5c6" stroke="#eef3ee" stroke-width="1"/>
      <line x1="88.0" y1="473.0" x2="82.8" y2="441.4" stroke="#f2f6f4" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="82.8" cy="441.4" r="2.6" fill="#ffe27a"/>
    </g>
    <g>
      <polygon points="567.1,454.8 583.1,456.3 576.2,443.6" fill="#c8d5c6" stroke="#eef3ee" stroke-width="1"/>
      <line x1="575.0" y1="456.5" x2="578.0" y2="424.7" stroke="#f2f6f4" stroke-width="2.2" stroke-linecap="round"/>
      <circle cx="578.0" cy="424.7" r="2.6" fill="#ffe27a"/>
    </g>

    <!-- Legend -->
    <rect x="636" y="28" width="242" height="248" rx="10" fill="#071018" fill-opacity="0.35" stroke="#2a4458" stroke-width="1"/>
    <g>
      <rect x="655" y="48" width="26" height="18" rx="3" fill="#e39a3a" fill-opacity="0.55" stroke="#ffd08a" stroke-width="1.2"/>
      <text x="691" y="62" fill="#e8eef4" font-size="15" font-weight="650" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">D-skiktet</text>
      <text x="691" y="80" fill="#9aafc0" font-size="12" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">ca 60–90 km</text>
    </g>
    <g>
      <rect x="655" y="106" width="26" height="18" rx="3" fill="#d1b63a" fill-opacity="0.55" stroke="#f5e48a" stroke-width="1.2"/>
      <text x="691" y="120" fill="#e8eef4" font-size="15" font-weight="650" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">E-skiktet</text>
      <text x="691" y="138" fill="#9aafc0" font-size="12" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">ca 90–150 km</text>
    </g>
    <g>
      <rect x="655" y="164" width="26" height="18" rx="3" fill="#2f9d6e" fill-opacity="0.55" stroke="#8ee0b4" stroke-width="1.2"/>
      <text x="691" y="178" fill="#e8eef4" font-size="15" font-weight="650" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">F1-skiktet</text>
      <text x="691" y="196" fill="#9aafc0" font-size="12" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">ca 150–250 km</text>
    </g>
    <g>
      <rect x="655" y="222" width="26" height="18" rx="3" fill="#1f8ea3" fill-opacity="0.55" stroke="#7ee3ef" stroke-width="1.2"/>
      <text x="691" y="236" fill="#e8eef4" font-size="15" font-weight="650" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">F2-skiktet</text>
      <text x="691" y="254" fill="#9aafc0" font-size="12" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">ca 250–400 km</text>
    </g>

    <text x="24" y="536" fill="#7e93a6" font-size="11.5" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">Höjderna är inte skalenliga</text>
  </g>
</svg>
