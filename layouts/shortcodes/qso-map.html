{{- /* Full-width QSO map: Leaflet + OSM + MarkerCluster, data from /data/qsos.json */ -}}
{{- $summary := dict -}}
{{- with resources.Get "data/qso-summary.json" -}}{{/* not in assets */}}{{- end -}}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css" crossorigin="">
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.Default.css" crossorigin="">
<style>
  .qso-map-wrap { margin: 1rem 0 1.5rem; }
  .qso-map-meta {
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem;
    font-size: 0.9rem; color: #64748b; margin-bottom: 0.75rem;
  }
  .dark .qso-map-meta { color: #94a3b8; }
  .qso-map-meta strong { color: #0f172a; font-weight: 600; }
  .dark .qso-map-meta strong { color: #e2e8f0; }
  #qso-map {
    width: 100%;
    height: min(70vh, 640px);
    min-height: 360px;
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.35);
    z-index: 0;
  }
  .dark #qso-map { border-color: rgba(148, 163, 184, 0.25); }
  .qso-map-legend {
    display: flex; flex-wrap: wrap; gap: 0.4rem 0.9rem;
    margin-top: 0.75rem; font-size: 0.8rem; color: #64748b;
  }
  .dark .qso-map-legend { color: #94a3b8; }
  .qso-map-legend span { display: inline-flex; align-items: center; gap: 0.35rem; }
  .qso-map-swatch {
    width: 10px; height: 10px; border-radius: 999px;
    box-shadow: 0 0 0 1px rgba(0,0,0,0.2);
  }
  .dark .qso-map-swatch { box-shadow: 0 0 0 1px rgba(255,255,255,0.25); }
  .qso-home-icon {
    background: #f59e0b; border: 2px solid #fff; border-radius: 50%;
    width: 16px; height: 16px;
    box-shadow: 0 0 0 2px #f59e0b;
  }
  .dark .qso-home-icon { border-color: #0f172a; }
  .qso-popup { font-size: 0.9rem; line-height: 1.35; }
  .qso-popup strong { font-size: 1rem; }
  .leaflet-container { font: inherit; background: #e2e8f0; }
  .dark .leaflet-container { background: #0f172a; }
  .dark .leaflet-control-attribution,
  .dark .leaflet-control-zoom a {
    background: #1e293b !important; color: #cbd5e1 !important;
    border-color: #334155 !important;
  }
  .dark .leaflet-control-attribution a { color: #93c5fd !important; }
  .dark .leaflet-popup-content-wrapper,
  .dark .leaflet-popup-tip {
    background: #1e293b; color: #e2e8f0;
  }
</style>

<div class="qso-map-wrap not-prose">
  <div class="qso-map-meta" id="qso-map-meta" aria-live="polite"></div>
  <div id="qso-map" role="region" aria-label="QSO map"></div>
  <div class="qso-map-legend" id="qso-map-legend"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js" crossorigin=""></script>
<script>
(function () {
  var BAND_COLORS = {
    "160m": "#7c3aed", "80m": "#2563eb", "60m": "#0891b2", "40m": "#059669",
    "30m": "#65a30d", "20m": "#ca8a04", "17m": "#ea580c", "15m": "#dc2626",
    "12m": "#db2777", "10m": "#c026d3", "6m": "#4f46e5", "2m": "#0ea5e9"
  };
  var FALLBACK = "#64748b";
  var i18n = {
    sv: {
      plotted: "QSO på kartan", confirmed: "bekräftade", dxcc: "DXCC",
      updated: "Uppdaterad", home: "Hemmastation", noData: "Kunde inte ladda QSO-data.",
      band: "Band", mode: "Mode", date: "Datum", grid: "Ruta", country: "Land"
    },
    en: {
      plotted: "QSOs on map", confirmed: "confirmed", dxcc: "DXCC",
      updated: "Updated", home: "Home station", noData: "Could not load QSO data.",
      band: "Band", mode: "Mode", date: "Date", grid: "Grid", country: "Country"
    }
  };
  var lang = (document.documentElement.lang || "sv").slice(0, 2);
  var t = i18n[lang] || i18n.en;

  function fmtDate(yyyymmdd) {
    if (!yyyymmdd || yyyymmdd.length < 8) return yyyymmdd || "";
    return yyyymmdd.slice(0, 4) + "-" + yyyymmdd.slice(4, 6) + "-" + yyyymmdd.slice(6, 8);
  }
  function colorFor(band) { return BAND_COLORS[(band || "").toLowerCase()] || FALLBACK; }

  function circleIcon(color, confirmed) {
    return L.divIcon({
      className: "",
      html: '<div style="width:12px;height:12px;border-radius:50%;background:' + color +
        ';border:2px solid ' + (confirmed ? '#fbbf24' : '#fff') +
        ';box-shadow:0 1px 2px rgba(0,0,0,.35)"></div>',
      iconSize: [12, 12], iconAnchor: [6, 6], popupAnchor: [0, -8]
    });
  }

  Promise.all([
    fetch("/data/qsos.json").then(function (r) { return r.json(); }),
    fetch("/data/qso-summary.json").then(function (r) { return r.json(); })
  ]).then(function (pair) {
    var qsos = pair[0], summary = pair[1];
    var meta = document.getElementById("qso-map-meta");
    var generated = summary.generated ? summary.generated.replace("T", " ").replace("Z", " UTC") : "";
    meta.innerHTML =
      "<span><strong>" + summary.plotted + "</strong> " + t.plotted + "</span>" +
      "<span><strong>" + (summary.confirmed || 0) + "</strong> " + t.confirmed + "</span>" +
      "<span><strong>" + (summary.dxcc || 0) + "</strong> " + t.dxcc + "</span>" +
      (generated ? "<span>" + t.updated + ": " + generated + "</span>" : "");

    var map = L.map("qso-map", { scrollWheelZoom: true, worldCopyJump: true });
    var lightTiles = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });
    var darkTiles = L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
      maxZoom: 18,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'
    });
    function isDark() {
      return document.documentElement.classList.contains("dark");
    }
    var tiles = isDark() ? darkTiles : lightTiles;
    tiles.addTo(map);

    var cluster = L.markerClusterGroup({
      showCoverageOnHover: false,
      maxClusterRadius: 42,
      spiderfyOnMaxZoom: true
    });
    var bounds = [];
    qsos.forEach(function (q) {
      if (typeof q.lat !== "number" || typeof q.lon !== "number") return;
      var color = colorFor(q.band);
      var marker = L.marker([q.lat, q.lon], { icon: circleIcon(color, q.confirmed) });
      var lines = ["<div class='qso-popup'><strong>" + (q.call || "") + "</strong>"];
      if (q.band || q.mode) lines.push("<div>" + t.band + ": " + (q.band || "—") + " · " + t.mode + ": " + (q.mode || "—") + "</div>");
      if (q.date) lines.push("<div>" + t.date + ": " + fmtDate(q.date) + (q.time ? " " + q.time.slice(0, 2) + ":" + q.time.slice(2, 4) + " UTC" : "") + "</div>");
      if (q.grid) lines.push("<div>" + t.grid + ": " + q.grid + "</div>");
      if (q.country) lines.push("<div>" + t.country + ": " + q.country + "</div>");
      lines.push("</div>");
      marker.bindPopup(lines.join(""));
      cluster.addLayer(marker);
      bounds.push([q.lat, q.lon]);
    });
    map.addLayer(cluster);

    if (summary.home && typeof summary.home.lat === "number") {
      var homeIcon = L.divIcon({
        className: "",
        html: '<div class="qso-home-icon" title="' + t.home + '"></div>',
        iconSize: [16, 16], iconAnchor: [8, 8], popupAnchor: [0, -10]
      });
      var home = L.marker([summary.home.lat, summary.home.lon], { icon: homeIcon, zIndexOffset: 1000 });
      home.bindPopup("<div class='qso-popup'><strong>" + (summary.home.label || "SM4T") + "</strong><div>" + t.home + (summary.home.grid ? " · " + summary.home.grid : "") + "</div></div>");
      home.addTo(map);
      bounds.push([summary.home.lat, summary.home.lon]);
    }

    if (bounds.length) map.fitBounds(bounds, { padding: [28, 28], maxZoom: 6 });
    else map.setView([60.5, 15.5], 4);

    var legend = document.getElementById("qso-map-legend");
    var bands = Object.keys(summary.bands || {});
    legend.innerHTML = bands.map(function (b) {
      return '<span><i class="qso-map-swatch" style="background:' + colorFor(b) + '"></i>' + b + "</span>";
    }).join("") + '<span><i class="qso-map-swatch" style="background:#f59e0b"></i>' + t.home + "</span>";

    // Switch tiles when Blowfish toggles dark mode
    var obs = new MutationObserver(function () {
      var wantDark = isDark();
      if (wantDark && map.hasLayer(lightTiles)) { map.removeLayer(lightTiles); darkTiles.addTo(map); }
      if (!wantDark && map.hasLayer(darkTiles)) { map.removeLayer(darkTiles); lightTiles.addTo(map); }
    });
    obs.observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
    setTimeout(function () { map.invalidateSize(); }, 200);
  }).catch(function () {
    document.getElementById("qso-map-meta").textContent = t.noData;
  });
})();
</script>
