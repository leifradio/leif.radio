{{- /* QSO map: Leaflet + OSM, data from /data/qsos.json */ -}}
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
  .qso-map-wrap { margin: 1rem 0 1.5rem; }
  .qso-map-meta {
    display: flex; flex-wrap: wrap; gap: 0.5rem 1.25rem;
    font-size: 0.9rem; color: #64748b; margin-bottom: 0.75rem;
  }
  .dark .qso-map-meta { color: #94a3b8; }
  .qso-map-meta strong { color: #0f172a; font-weight: 600; }
  .dark .qso-map-meta strong { color: #e2e8f0; }
  #qso-map {
    width: 100%;
    height: min(70vh, 640px);
    min-height: 360px;
    border-radius: 0.75rem;
    overflow: hidden;
    border: 1px solid rgba(148, 163, 184, 0.35);
    z-index: 0;
  }
  .dark #qso-map { border-color: rgba(148, 163, 184, 0.25); }
  .qso-popup { font-size: 0.9rem; line-height: 1.35; }
  .qso-popup strong { font-size: 1rem; }
  .leaflet-container { font: inherit; background: #e2e8f0; }
  .dark .leaflet-container { background: #0f172a; }
  .dark .leaflet-control-attribution,
  .dark .leaflet-control-zoom a {
    background: #1e293b !important; color: #cbd5e1 !important;
    border-color: #334155 !important;
  }
  .dark .leaflet-control-attribution a { color: #93c5fd !important; }
  .dark .leaflet-popup-content-wrapper,
  .dark .leaflet-popup-tip {
    background: #1e293b; color: #e2e8f0;
  }
  /* Band colour legend — Leaflet control on the map */
  .qso-band-legend {
    background: rgba(255, 255, 255, 0.94);
    color: #0f172a;
    border-radius: 0.5rem;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.25);
    padding: 0.55rem 0.7rem;
    line-height: 1.25;
    font-size: 0.78rem;
    max-width: min(46vw, 11.5rem);
  }
  .dark .qso-band-legend {
    background: rgba(15, 23, 42, 0.92);
    color: #e2e8f0;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
  }
  .qso-band-legend-title {
    font-weight: 700;
    font-size: 0.8rem;
    margin-bottom: 0.35rem;
  }
  .qso-band-legend-row {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    margin: 0.18rem 0;
  }
  .qso-band-legend-swatch {
    width: 12px;
    height: 12px;
    border-radius: 999px;
    flex-shrink: 0;
    box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.25);
  }
  .dark .qso-band-legend-swatch {
    box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.35);
  }

  .qso-latest {
    margin-top: 1.25rem;
  }
  .qso-latest-title {
    font-size: 1.05rem;
    font-weight: 700;
    margin: 0 0 0.5rem;
    color: #0f172a;
  }
  .dark .qso-latest-title { color: #e2e8f0; }
  .qso-latest-list {
    list-style: none;
    margin: 0;
    padding: 0;
    border: 1px solid rgba(148, 163, 184, 0.35);
    border-radius: 0.75rem;
    overflow: hidden;
  }
  .dark .qso-latest-list { border-color: rgba(148, 163, 184, 0.25); }
  .qso-latest-list li {
    display: grid;
    grid-template-columns: minmax(0, 1.1fr) auto minmax(0, 1.4fr);
    gap: 0.35rem 0.75rem;
    align-items: baseline;
    padding: 0.55rem 0.8rem;
    font-size: 0.92rem;
    border-top: 1px solid rgba(148, 163, 184, 0.25);
  }
  .qso-latest-list li:first-child { border-top: 0; }
  .dark .qso-latest-list li { border-top-color: rgba(148, 163, 184, 0.18); }
  .qso-latest-call { font-weight: 700; color: #0f172a; overflow-wrap: anywhere; }
  .dark .qso-latest-call { color: #f1f5f9; }
  .qso-latest-band {
    font-variant-numeric: tabular-nums;
    color: #475569;
    white-space: nowrap;
  }
  .dark .qso-latest-band { color: #94a3b8; }
  .qso-latest-country { color: #334155; overflow-wrap: anywhere; }
  .dark .qso-latest-country { color: #cbd5e1; }
  @media (max-width: 420px) {
    .qso-latest-list li {
      grid-template-columns: minmax(0, 1fr) auto;
      grid-template-areas: "call band" "country country";
      gap: 0.15rem 0.6rem;
      padding: 0.55rem 0.7rem;
      font-size: 0.88rem;
    }
    .qso-latest-call { grid-area: call; }
    .qso-latest-band { grid-area: band; justify-self: end; }
    .qso-latest-country { grid-area: country; }
  }
  @media (max-width: 420px) {
    .qso-band-legend {
      font-size: 0.72rem;
      padding: 0.45rem 0.55rem;
      max-width: 42vw;
    }
    .qso-band-legend-swatch { width: 10px; height: 10px; }
  }
</style>

<div class="qso-map-wrap not-prose">
  <div class="qso-map-meta" id="qso-map-meta" aria-live="polite"></div>
  <div id="qso-map" role="region" aria-label="QSO map"></div>
  <div class="qso-latest" id="qso-latest" hidden>
    <h2 class="qso-latest-title" id="qso-latest-title"></h2>
    <ul class="qso-latest-list" id="qso-latest-list"></ul>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="/js/qso-map.js"></script>
