baseURL = "https://leif.radio/"
languageCode = "en-us"
defaultContentLanguage = "en"
title = "SM4T – Leif.radio"
theme = "PaperMod"
enableRobotsTXT = true

[pagination]
  pagerSize = 10

[params]
  description = "Amateur radio station SM4T – mostly CW on 20 and 40 m."
  author = "SM4T"
  defaultTheme = "auto"
  ShowReadingTime = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowToc = false
  DateFormat = "2 January 2006"

  [params.homeInfoParams]
    Title = "SM4T – Leif.radio"
    Content = """
Welcome to amateur radio station **SM4T**. I write about CW, mostly on 20 and 40 meters, along with contests, propagation and gear.
"""

